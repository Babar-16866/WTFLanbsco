name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DYNAMIC_ORIGIN: ${{ vars.DYNAMIC_ORIGIN }}
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/php.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/index.php && break; sleep 1; done
          node .github/scripts/build-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
